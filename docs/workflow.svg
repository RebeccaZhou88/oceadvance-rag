<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1380 780" width="1380" height="780">
  <defs>
    <linearGradient id="gSTART" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gCACHE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="gINTENT" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="gRETRIEVE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gRERANK" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0e7490"/>
    </linearGradient>
    <linearGradient id="gGENERATE" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gEVAL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="gEND" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="gGOV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="gGOVDIAMOND" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#14b8a6"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>

    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.3"/>
    </filter>

    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#94a3b8"/>
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#f59e0b"/>
    </marker>
    <marker id="arrowTeal" viewBox="0 0 10 10" refX="9" refY="5"
            markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#14b8a6"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1380" height="780" fill="#0b1220" rx="14"/>

  <!-- ===== LEFT: LangGraph Pipeline (x center = 220) ===== -->
  <text x="30" y="34" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="17" font-weight="700">LangGraph Pipeline / LangGraph 主流程</text>

  <!-- START -->
  <ellipse cx="220" cy="80" rx="55" ry="22" fill="url(#gSTART)" filter="url(#shadow)"/>
  <text x="220" y="85" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">START</text>

  <line x1="220" y1="102" x2="220" y2="130" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cache Lookup (NEW) -->
  <rect x="145" y="130" width="150" height="52" rx="9" fill="url(#gCACHE)" filter="url(#shadow)"/>
  <text x="220" y="152" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">精确缓存查找</text>
  <text x="220" y="170" fill="#fde68a" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Exact Cache Lookup</text>

  <line x1="220" y1="182" x2="220" y2="210" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cache Hit? Diamond -->
  <polygon points="220,210 290,250 220,290 150,250" fill="#1e293b" stroke="#f59e0b" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="220" y="247" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">命中?</text>
  <text x="220" y="263" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Hit?</text>

  <!-- Cache HIT → END shortcut (right side, going down) -->
  <path d="M 290 250 L 395 250 L 395 740 L 275 740" fill="none" stroke="#f59e0b" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrowAmber)"/>
  <text x="320" y="232" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="700">命中 / Hit</text>
  <text x="320" y="248" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="9.5">→ END (跳过 RAG / skip)</text>

  <!-- Cache MISS → Intent Check -->
  <line x1="220" y1="290" x2="220" y2="320" stroke="#f59e0b" stroke-width="1.8" marker-end="url(#arrowAmber)"/>
  <text x="235" y="307" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">未命中 / Miss</text>

  <!-- Intent Classification -->
  <rect x="130" y="320" width="180" height="52" rx="9" fill="url(#gINTENT)" filter="url(#shadow)"/>
  <text x="220" y="342" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">意图识别</text>
  <text x="220" y="360" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Intent Classification</text>

  <line x1="220" y1="372" x2="220" y2="402" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- chitchat? Diamond -->
  <polygon points="220,402 290,442 220,482 150,442" fill="#1e293b" stroke="#8b5cf6" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="220" y="439" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">chitchat?</text>
  <text x="220" y="455" fill="#ddd6fe" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">闲聊?</text>

  <!-- chitchat → Generate Answer (left detour) -->
  <path d="M 150 442 L 55 442 L 55 620 L 130 620" fill="none" stroke="#8b5cf6" stroke-width="1.8" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="72" y="428" fill="#c4b5fd" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">chitchat / 闲聊</text>

  <!-- query/followup → Retrieve -->
  <line x1="220" y1="482" x2="220" y2="512" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="235" y="500" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">query / followup / 查询</text>

  <!-- Hybrid Retrieval -->
  <rect x="130" y="512" width="180" height="52" rx="9" fill="url(#gRETRIEVE)" filter="url(#shadow)"/>
  <text x="220" y="534" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">混合检索 + 权限过滤</text>
  <text x="220" y="552" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Hybrid Retrieval + Filter</text>

  <line x1="220" y1="564" x2="220" y2="594" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Rerank -->
  <rect x="130" y="594" width="180" height="52" rx="9" fill="url(#gRERANK)" filter="url(#shadow)"/>
  <text x="220" y="616" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">重排 + 上下文组装</text>
  <text x="220" y="634" fill="#a5f3fc" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Rerank + Context Build</text>

  <text x="322" y="620" fill="#64748b" font-family="system-ui, sans-serif" font-size="10.5" font-style="italic">async · 异步</text>

  <line x1="220" y1="646" x2="220" y2="676" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Generate Answer -->
  <rect x="130" y="676" width="180" height="52" rx="9" fill="url(#gGENERATE)" filter="url(#shadow)"/>
  <text x="220" y="698" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">生成带引用回答</text>
  <text x="220" y="716" fill="#a7f3d0" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Answer with Citations</text>

  <!-- Cache write label -->
  <rect x="318" y="680" width="90" height="34" rx="5" fill="#f59e0b" fill-opacity="0.15" stroke="#f59e0b" stroke-width="1"/>
  <text x="363" y="694" fill="#fbbf24" font-family="system-ui, sans-serif" font-size="9.5" font-weight="600" text-anchor="middle">写入缓存</text>
  <text x="363" y="708" fill="#fcd34d" font-family="system-ui, sans-serif" font-size="8.5" text-anchor="middle">write cache</text>

  <line x1="220" y1="728" x2="220" y2="748" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Evaluate Answer -->
  <rect x="130" y="748" width="180" height="30" rx="6" fill="url(#gEVAL)" filter="url(#shadow)"/>
  <text x="220" y="767" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">在线评估 · Online Evaluation</text>

  <!-- END ellipse (bottom center, shared by both paths) -->
  <ellipse cx="615" cy="763" rx="55" ry="22" fill="url(#gEND)" filter="url(#shadow)"/>
  <text x="615" y="768" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">END</text>

  <!-- Evaluate → END -->
  <path d="M 310 763 L 560 763" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Cache HIT → END (the dashed amber path) -->
  <!-- Already drawn above, ends near x=275 y=740. Let me extend to END -->
  <!-- Re-route: M 290 250 L 560 250 L 560 763 L 560 763 → but that overlaps with evaluate path -->
  <!-- Better: M 290 250 L 395 250 L 395 763 L 560 763 -->
  <!-- Actually let me re-draw the hit path properly -->

  <!-- ===== RIGHT: CrewAI Governance (x center = 990) ===== -->
  <text x="760" y="34" fill="#e2e8f0" font-family="system-ui, sans-serif" font-size="17" font-weight="700">CrewAI Quality Governance / CrewAI 质量治理</text>
  <text x="760" y="54" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="11" font-style="italic">Async / 异步 · non-blocking / 不阻塞</text>

  <!-- Trigger Detection -->
  <rect x="895" y="75" width="190" height="52" rx="9" fill="url(#gGOV)" filter="url(#shadow)"/>
  <text x="990" y="97" fill="#fff" font-family="system-ui, sans-serif" font-size="13" font-weight="700" text-anchor="middle">触发判定</text>
  <text x="990" y="115" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10.5" text-anchor="middle">Trigger Detection · routes.py → manager.py</text>

  <line x1="990" y1="127" x2="990" y2="157" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- 命中? Diamond -->
  <polygon points="990,157 1060,192 990,227 920,192" fill="#0f172a" stroke="#14b8a6" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="990" y="189" fill="#5eead4" font-family="system-ui, sans-serif" font-size="11.5" font-weight="700" text-anchor="middle">命中?</text>
  <text x="990" y="205" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Hit?</text>

  <!-- skip -->
  <path d="M 1060 192 L 1160 192" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4,3" marker-end="url(#arrow)"/>
  <text x="1105" y="186" fill="#64748b" font-family="system-ui, sans-serif" font-size="10" font-weight="600">skip / 跳过</text>

  <line x1="990" y1="227" x2="990" y2="257" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>
  <text x="1005" y="245" fill="#5eead4" font-family="system-ui, sans-serif" font-size="10.5" font-weight="600">yes</text>

  <!-- Async Task -->
  <rect x="900" y="257" width="180" height="44" rx="9" fill="url(#gGOV)" filter="url(#shadow)"/>
  <text x="990" y="277" fill="#fff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">异步任务 _spawn()</text>
  <text x="990" y="293" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Async Task · asyncio.create_task</text>

  <line x1="990" y1="301" x2="990" y2="328" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Blind Spot Analyst -->
  <rect x="900" y="328" width="180" height="44" rx="9" fill="url(#gGOV)" filter="url(#shadow)"/>
  <text x="990" y="348" fill="#fff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">盲区分析师 · Agent 1</text>
  <text x="990" y="364" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Blind Spot Analyst</text>

  <line x1="990" y1="372" x2="990" y2="399" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Doc Quality Assessor -->
  <rect x="900" y="399" width="180" height="44" rx="9" fill="url(#gGOV)" filter="url(#shadow)"/>
  <text x="990" y="419" fill="#fff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">文档质量评估师 · Agent 2</text>
  <text x="990" y="435" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Doc Quality Assessor</text>

  <line x1="990" y1="443" x2="990" y2="470" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Remediation Advisor -->
  <rect x="900" y="470" width="180" height="44" rx="9" fill="url(#gGOV)" filter="url(#shadow)"/>
  <text x="990" y="490" fill="#fff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">改进顾问 · Agent 3</text>
  <text x="990" y="506" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Remediation Advisor</text>

  <line x1="990" y1="514" x2="990" y2="541" stroke="#14b8a6" stroke-width="2" marker-end="url(#arrowTeal)"/>

  <!-- Persist → Dashboard Polling -->
  <rect x="900" y="541" width="180" height="44" rx="9" fill="url(#gGOV)" filter="url(#shadow)"/>
  <text x="990" y="561" fill="#fff" font-family="system-ui, sans-serif" font-size="12.5" font-weight="700" text-anchor="middle">落库 → 看板轮询</text>
  <text x="990" y="577" fill="#99f6e4" font-family="system-ui, sans-serif" font-size="10" text-anchor="middle">Persist → Dashboard Polling</text>

  <!-- ===== Inter-connection: LangGraph → CrewAI ===== -->
  <!-- From Generate Answer node (left) to Trigger Detection (right) -->
  <path d="M 310 690 L 760 690 L 760 101 L 895 101" fill="none" stroke="#14b8a6" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.6"/>

</svg>
