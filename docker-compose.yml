services:
  rag-api:
    build: .
    image: ops-rag-assistant:0.1.0
    container_name: ops-rag-api
    ports:
      - "8000:8000"
    environment:
      - USE_MOCK_BACKEND=true
      - RERANK_STRATEGY=none
      - PROMETHEUS_ENABLED=true
      - LOG_LEVEL=INFO
      - FRONTEND_DIR=/app/frontend
    volumes:
      # 开发时挂载数据目录便于热更新
      - ./backend/data:/app/backend/data:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3

  prometheus:
    image: prom/prometheus:latest
    container_name: ops-rag-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./backend/infra/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - rag-api

  grafana:
    image: grafana/grafana:latest
    container_name: ops-rag-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus
